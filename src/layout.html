<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17241f">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  {{SEO}}
  {{VERIFICATION}}
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:site_name" content="{{NAME}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  {{SHARE_IMAGE}}
  <link rel="icon" href="./{{LOGO_SRC}}" type="{{LOGO_TYPE}}">
  <link rel="stylesheet" href="{{STYLE_URL}}">
  <script src="{{SCRIPT_URL}}" defer></script>
  <script type="application/ld+json">{{SCHEMA}}</script>
</head>
<body class="premium page-{{PAGE_KEY}}">
<a class="skip" href="#main">본문 바로가기</a>{{PREVIEW_NOTICE}}
<header class="premium-header"><div class="content-width premium-header-inner">
  <a class="brand" href="/" aria-label="SMC 인천 구월점 첫 화면">{{LOGO_IMAGE}}<span><strong>SMC</strong><small>인천 구월점 · 음악연습실</small></span></a>
  <a class="header-book naver-book" href="{{BOOKING}}" target="_blank" rel="noopener noreferrer"><span class="naver-mark" aria-hidden="true"></span><span class="naver-label">네이버 예약</span><span class="booking-arrow" aria-hidden="true">↗</span></a>
  <nav class="primary-nav" aria-label="주 메뉴">{{NAV}}</nav>
</div></header>
<main id="main">{{PAGE_CONTENT}}</main>
  <footer class="site-footer content-width"><div><p><strong>SMC</strong> 인천 구월점</p><p class="footer-address">{{ADDRESS}}<br>전화 <a href="{{TEL}}">{{PHONE}}</a> · {{HOURS}}</p><p class="copyright">© {{YEAR}} {{NAME}}</p></div><div><a href="{{KAKAO}}" target="_blank" rel="noopener noreferrer">카카오톡 문의</a><a href="{{INSTAGRAM}}" target="_blank" rel="noopener noreferrer">인스타그램</a><a href="{{YOUTUBE}}" target="_blank" rel="noopener noreferrer">유튜브</a><a href="{{BLOG}}" target="_blank" rel="noopener noreferrer">블로그</a></div></footer>
  <aside class="mobile-booking" aria-label="빠른 예약"><a data-mobile-secondary href="{{TEL}}">전화 문의</a><a class="naver-book" data-mobile-primary href="{{BOOKING}}" target="_blank" rel="noopener noreferrer"><span class="naver-mark" aria-hidden="true"></span><span class="mobile-booking-label"><small data-mobile-room>일반 연습실</small><span data-mobile-action>네이버 예약 ↗</span></span></a></aside>
  <dialog class="photo-viewer" aria-labelledby="photo-viewer-title">
    <div class="photo-viewer-header"><h2 id="photo-viewer-title">SMC 공간 사진</h2><button class="photo-close" type="button" autofocus>닫기 <span aria-hidden="true">×</span></button></div>
    <figure>{{HALL_IMAGE}}<figcaption></figcaption></figure>
  </dialog>

{{ASSISTANT}}
</body></html>
